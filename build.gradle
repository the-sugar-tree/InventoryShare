plugins {
    id("net.minecraftforge.licenser") version "1.2.0" apply false
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'net.minecraftforge.licenser'

    group = 'com.sugar_tree.inventoryshare'
    version = '4.0'
    description = 'Minecraft Plugin'

    plugins.withType(JavaPlugin).configureEach {
        tasks.withType(JavaCompile).configureEach {
            options.release = 8
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            name = 'spigotmc-repo'
            url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
        }
        maven {
            name = 'papermc-repo'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        maven {
            name = 'sponge-repo'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'dmulloy2(ProtocolLib)-repo'
            url = 'https://repo.dmulloy2.net/repository/public/'
        }
        maven {
            url = 'https://libraries.minecraft.net/'
        }
    }

    dependencies {
        compileOnly rootProject.libs.lombok
        annotationProcessor rootProject.libs.lombok
        compileOnly rootProject.libs.jetbrains.annotations
    }

    jar {
        from '../LICENSE.md'
    }

    jar.doLast {
        copy {
            from("build/libs") {
                include '*.jar'
            }
            into(rootProject.file("build/libs"))
            // The released plugin jar, under the name the release download link uses
            rename(/InventoryShare-bukkit-(.+)-\[.+]\.jar/, 'InventoryShare-$1.jar')
        }
    }

    license {
        header = rootProject.file('HEADER.txt')
        include '**/*.java'
        exclude '**/Metrics.java'
        newLine = true
        properties {
            name = 'the-sugar-tree and contributors'
            year = '2023'
        }
    }
}

tasks.withType(Jar).configureEach {
    enabled = false
}
tasks.withType(JavaCompile).configureEach {
    enabled = false
}
