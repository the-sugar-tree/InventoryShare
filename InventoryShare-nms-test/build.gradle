// Verifies the NMS names built by InventoryNameFactory and ItemNameFactory against real Spigot runtime jars installed into mavenLocal by BuildTools,
// (1.17+) against the Mojang-named `remapped-mojang` jars, and against Paper server jars prepared by preparePaperJars.
// A jar that is not installed is skipped; run with -PnmsStrict to prepare the Paper jars and fail on any missing jar.

import groovy.json.JsonSlurper

import java.security.MessageDigest

// Minecraft version -> Spigot artifact version (default classifier = the jar a server runs)
def spigotJars = [
        // Legacy (items / armor / extraSlots / contents)
        '1.12.2' : '1.12.2-R0.1-SNAPSHOT',
        '1.13'   : '1.13-R0.1-SNAPSHOT',
        '1.13.1' : '1.13.1-R0.1-SNAPSHOT',
        '1.13.2' : '1.13.2-R0.1-SNAPSHOT',
        '1.14.4' : '1.14.4-R0.1-SNAPSHOT',
        '1.15.2' : '1.15.2-R0.1-SNAPSHOT',
        '1.16.1' : '1.16.1-R0.1-SNAPSHOT',
        '1.16.3' : '1.16.3-R0.1-SNAPSHOT',
        '1.16.5' : '1.16.5-R0.1-SNAPSHOT',
        '1.17.1' : '1.17.1-R0.1-SNAPSHOT',
        '1.18'   : '1.18-R0.1-SNAPSHOT',
        '1.18.2' : '1.18.2-R0.1-SNAPSHOT',
        '1.19'   : '1.19-R0.1-SNAPSHOT',
        '1.19.2' : '1.19.2-R0.1-SNAPSHOT',
        '1.19.3' : '1.19.3-R0.1-SNAPSHOT',
        '1.19.4' : '1.19.4-R0.1-SNAPSHOT',
        '1.20.1' : '1.20.1-R0.1-SNAPSHOT',
        '1.20.2' : '1.20.2-R0.1-SNAPSHOT',
        '1.20.4' : '1.20.4-R0.1-SNAPSHOT',
        '1.20.6' : '1.20.6-R0.1-SNAPSHOT',
        '1.21.1' : '1.21.1-R0.1-SNAPSHOT',
        '1.21.3' : '1.21.3-R0.1-SNAPSHOT',
        '1.21.4' : '1.21.4-R0.1-SNAPSHOT',
        // Modern (items + EntityEquipment)
        '1.21.5' : '1.21.5-R0.1-SNAPSHOT',
        '1.21.6' : '1.21.6-R0.1-SNAPSHOT',
        '1.21.8' : '1.21.8-R0.1-SNAPSHOT',
        '1.21.10': '1.21.10-R0.1-SNAPSHOT',
        '1.21.11': '1.21.11-R0.2-SNAPSHOT',
        '26.1.2' : '26.1.2-R0.1-SNAPSHOT',
        '26.2'   : '26.2-R0.1-SNAPSHOT',
        '26.3'   : '26.3-R0.1-SNAPSHOT',
]

// Versions that are also checked with Mojang's names (Paper 1.20.5+, Paper's Mojang-mapped 1.20.4):
// BuildTools' `--remapped` output, classifier `remapped-mojang`. 26.1+ jars already use Mojang's names.
def mojangJars = spigotJars.findAll { mc, artifact ->
    def parts = mc.tokenize('.')*.toInteger()
    parts[0] == 1 && parts[1] >= 17
}

// Paper changes CraftBukkit itself (26.3 renamed CraftItemStack#asCraftMirror), which no Spigot jar shows.
// Minecraft version -> JDK that runs Paperclip to build the server jar. The latest build of each is kept in the Gradle
// user home; preparePaperJars downloads a build only when a newer one is released.
def paperJars = [
        '1.20.4' : 17,   // the last Paper on Spigot's names
        '1.20.6' : 21,
        '1.21.4' : 21,
        '1.21.5' : 21,
        '1.21.11': 21,
        '26.1.2' : 25,
        '26.2'   : 25,
        '26.3'   : 25,
]
def paperCache = new File(gradle.gradleUserHomeDir, 'caches/inventoryshare/paper')

// The server jar of the newest prepared build of a Paper version, or null
def paperServerJar = { String mc ->
    def builds = new File(paperCache, mc).listFiles()?.findAll { it.name.isInteger() } ?: []
    builds.sort { it.name.toInteger() }.reverse()
            .collect { new File(it, "versions/${mc}/paper-${mc}.jar") }
            .find { it.isFile() }
}

interface InjectedExecOperations {
    @Inject
    ExecOperations getExecOperations()
}
def execOperations = objects.newInstance(InjectedExecOperations).execOperations

tasks.register('preparePaperJars') {
    group = 'verification'
    description = 'Downloads the latest build of each Paper version checked by the tests and builds its server jar'
    def launchers = paperJars.collectEntries { mc, jdk ->
        [mc, javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(jdk) }]
    }
    doLast {
        def api = { String path ->
            def connection = new URL("https://fill.papermc.io/v3/projects/paper/${path}").openConnection()
            connection.setRequestProperty('User-Agent', 'InventoryShare-nms-test (https://github.com/the-sugar-tree/InventoryShare)')
            connection.inputStream.withCloseable { new JsonSlurper().parse(it) }
        }
        paperJars.each { mc, jdk ->
            def build = api("versions/${mc}/builds/latest")
            def dir = new File(paperCache, "${mc}/${build.id}")
            if (new File(dir, "versions/${mc}/paper-${mc}.jar").isFile()) return

            def download = build.downloads['server:default']
            def paperclip = new File(dir, 'paperclip.jar')
            dir.mkdirs()
            new URL(download.url).withInputStream { input -> paperclip.withOutputStream { it << input } }
            def sha256 = MessageDigest.getInstance('SHA-256').digest(paperclip.bytes).encodeHex().toString()
            if (sha256 != download.checksums.sha256) {
                dir.deleteDir()
                throw new GradleException("Checksum mismatch for Paper ${mc} build ${build.id}")
            }
            // Downloads the Mojang server jar and the libraries, applies Paper's patches, and exits
            execOperations.exec {
                workingDir = dir
                executable = launchers[mc].get().executablePath.asFile
                args '-Dpaperclip.patchonly=true', '-jar', paperclip.name
            }
            logger.lifecycle("Paper ${mc} build ${build.id} prepared")
        }
    }
}

// Reading 26.x class files needs a recent JVM; the tests themselves never run NMS code.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// Each checked Spigot jar: key in server-classpaths.properties -> [configuration, dependency notation, server jar name]
def checkedJars = [:]
spigotJars.each { mc, artifact ->
    checkedJars[mc] = ["spigot_" + mc.replace('.', '_'), "org.spigotmc:spigot:${artifact}", "spigot-${artifact}.jar"]
}
mojangJars.each { mc, artifact ->
    checkedJars["${mc}@mojang".toString()] = ["spigot_" + mc.replace('.', '_') + "_mojang",
                                              "org.spigotmc:spigot:${artifact}:remapped-mojang",
                                              "spigot-${artifact}-remapped-mojang.jar"]
}

checkedJars.each { key, spec ->
    configurations.create(spec[0]) {
        canBeConsumed = false
    }
    dependencies.add(spec[0], spec[1])
}

dependencies {
    testImplementation project(':InventoryShare-nms')
    testImplementation libs.spigot.api
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

jar {
    enabled = false
}

test {
    useJUnitPlatform()
    boolean strict = project.hasProperty('nmsStrict')
    if (strict) dependsOn 'preparePaperJars'
    // Classpaths are written to a file: passing them as system properties exceeds the Windows command line limit
    def classpathFile = layout.buildDirectory.file('server-classpaths.properties').get().asFile
    inputs.property('spigotJars', spigotJars)
    inputs.property('mojangJars', mojangJars.keySet())
    inputs.property('paperJars', paperJars.keySet())
    // The prepared Paper builds: a newer build reruns the tests
    inputs.property('paperBuilds', providers.provider { paperJars.keySet().collect { paperServerJar(it)?.path } })
    inputs.property('nmsStrict', strict)
    systemProperty 'spigot.versions', spigotJars.keySet().join(',')
    systemProperty 'spigot.mojangVersions', mojangJars.keySet().join(',')
    systemProperty 'paper.versions', paperJars.keySet().join(',')
    systemProperty 'server.classpaths', classpathFile.absolutePath
    doFirst {
        def classpaths = new Properties()
        checkedJars.each { key, spec ->
            def configuration = configurations.getByName(spec[0])
            def files = strict
                    ? configuration.files
                    : configuration.incoming.artifactView { lenient = true }.files.files
            // Without the server jar itself the remaining (API/library) jars are useless: treat as not installed
            def server = files.find { it.name == spec[2] }
            classpaths.setProperty(key, server ? files.collect { it.absolutePath }.join(File.pathSeparator) : '')
            classpaths.setProperty(key + '.server', server ? server.absolutePath : '')
        }
        paperJars.keySet().each { mc ->
            def server = paperServerJar(mc)
            if (strict && !server) throw new GradleException("Paper ${mc} is not prepared")
            def libraries = server ? fileTree(new File(server, '../../../libraries')) { include '**/*.jar' }.files : []
            def files = server ? [server] + libraries : []
            classpaths.setProperty("${mc}@paper", files.collect { it.absolutePath }.join(File.pathSeparator))
            classpaths.setProperty("${mc}@paper.server", server ? server.absolutePath : '')
        }
        classpathFile.parentFile.mkdirs()
        classpathFile.withOutputStream { classpaths.store(it, 'Server runtime classpaths by Minecraft version') }
    }
}
