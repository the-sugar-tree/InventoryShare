// Development sandboxes: the released plugin (InventoryShare-bukkit) with its InventoryAccess replaced by
// direct NMS code for one Minecraft version. Included only with -Pdev; never released.
// Each subproject compiles against the Spigot server jar installed into mavenLocal by BuildTools.
//
// Also hosts local Paper test servers (run-task, https://github.com/jpenilla/run-task), one task per server:
//   ./gradlew :InventoryShare-dev:runPaper_1_21_4

plugins {
    id 'xyz.jpenilla.run-paper' version '3.0.2'     // 3.1.0 needs Gradle 9.7
}

import xyz.jpenilla.runpaper.task.RunServer

// Test servers: name -> JDK the server runs on, and
//   mc:       Minecraft version, if the name is not one
//   localJar: run-task cannot download this build; the task exists only if its jar is given as
//             -PpaperJar_<task suffix>=<path> or in gradle.properties (git-ignored)
def paperServers = [
        '1.20.4'       : [jdk: 17],
        '1.20.4-mojang': [jdk: 17, mc: '1.20.4', localJar: true],   // Paper's Mojang-mapped 1.20.4 build
        '1.20.6'       : [jdk: 21],
        '1.21.1'       : [jdk: 21],
        '1.21.4'       : [jdk: 21],
        '1.21.5'       : [jdk: 21],
        '1.21.8'       : [jdk: 21],
        '1.21.11'      : [jdk: 21],
        '26.1.2'       : [jdk: 25],
        '26.2'         : [jdk: 25],
]

// The released plugin jar; InventoryShare-nms is bundled inside it
configurations {
    testServerPlugin {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    testServerPlugin project(':InventoryShare-bukkit')
}

paperServers.each { name, server ->
    def suffix = name.replaceAll(/[.-]/, '_')
    def localJar = server.localJar ? findProperty("paperJar_${suffix}") : null
    if (server.localJar && !localJar) return

    tasks.register("runPaper_${suffix}", RunServer) {
        group = 'run paper'
        description = "Runs a Paper ${name} server with the InventoryShare plugin jar"
        minecraftVersion(server.mc ?: name)
        if (localJar) serverJar(file(localJar))
        pluginJars.from(configurations.testServerPlugin)
        runDirectory = layout.projectDirectory.dir("run/paper-${name}")
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(server.jdk) }
        // Accepts the Minecraft EULA (https://aka.ms/MinecraftEULA) for these local test servers
        jvmArgs('-Dcom.mojang.eula.agree=true')
        args('--nogui')
    }
}

subprojects {
    dependencies {
        implementation project(':InventoryShare-bukkit')
    }

    // A runnable plugin jar: core (with InventoryShare-nms) + this sandbox's InventoryAccessProvider
    jar {
        archiveFileName.set("InventoryShare-dev-${project.version}-[${project.name}].jar")
        from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.withType(Jar).configureEach {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    enabled = false
}
