allprojects {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 8
    }
}

dependencies {
    compileOnly "net.dmulloy2:ProtocolLib:5.3.0"
    compileOnly 'org.spigotmc:spigot-api:1.13-R0.1-SNAPSHOT'
    implementation project(':InventoryShare-nms')

    testImplementation 'org.spigotmc:spigot-api:1.13-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    String subVersion = '1.12.2-26.2'
    manifest {
        archiveFileName.set("InventoryShare-bukkit-${project.version}-[${subVersion}].jar")
    }
    // Bundle InventoryShare-nms (the only runtime dependency) into the plugin jar
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    filesMatching('languages/*.yml') {
        expand props
    }
}
