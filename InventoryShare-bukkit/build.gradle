allprojects {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 8
    }
}

dependencies {
    compileOnly libs.protocollib
    compileOnly libs.spigot.api
    implementation project(':InventoryShare-nms')

    testImplementation libs.spigot.api
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testCompileOnly libs.jetbrains.annotations
}

test {
    useJUnitPlatform()
}

jar {
    String subVersion = '1.12.2-26.2'
    manifest {
        archiveFileName.set("InventoryShare-bukkit-${project.version}-[${subVersion}].jar")
    }
    // Bundle InventoryShare-nms (the only runtime dependency) into the plugin jar
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    filesMatching('languages/*.yml') {
        expand props
    }
}
