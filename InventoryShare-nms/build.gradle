// NMS access layer shared by every supported Minecraft version.
// Compiles against spigot-api, and DataFixerUpper for the item codec (1.20.5+); all NMS members are resolved by
// reflection at runtime.

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

repositories {
    maven {
        name = 'minecraft-libraries'
        url = 'https://libraries.minecraft.net/'
        content { includeGroup 'com.mojang' }
    }
}

dependencies {
    compileOnly libs.spigot.api
    // Provided by the server from 1.20.5 (the version 1.20.5 and 1.20.6 ship); only the item codec uses it
    compileOnly libs.datafixerupper

    testImplementation libs.spigot.api
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testCompileOnly libs.jetbrains.annotations
}

// Bundled into InventoryShare-bukkit; do not copy this jar into the root build/libs.
jar.actions.removeIf {
    (it.properties.get("displayName") == "Execute doLast {} action")
}

test {
    useJUnitPlatform()
}
