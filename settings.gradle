rootProject.name = 'InventoryShare'
include 'InventoryShare-bukkit'

include 'InventoryShare-bukkit-test'
file("${rootDir}/InventoryShare-bukkit-test").eachDir { dir ->
    if (file("${dir}/build.gradle").exists()) {
        include "InventoryShare-bukkit-test:${dir.name}"
        findProject(":InventoryShare-bukkit-test:${dir.name}")?.name = dir.name
    }
}

include 'InventoryShare-single'
include 'InventoryShare-single:v1_21_R4'
findProject(':InventoryShare-single:v1_21_R4')?.name = 'v1_21_R4'
include 'InventoryShare-single:v26_2'
findProject(':InventoryShare-single:v26_2')?.name = 'v26_2'
include 'InventoryShare-single:InventoryShare-all'

