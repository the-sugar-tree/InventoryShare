rootProject.name = 'InventoryShare'
include 'InventoryShare-bukkit'
include 'InventoryShare-nms'
include 'InventoryShare-nms-test'

// Direct-NMS development sandboxes (need BuildTools jars). Enable with -Pdev or dev=true in gradle.properties.
if (providers.gradleProperty('dev').isPresent()) {
    include 'InventoryShare-dev'
    file("${rootDir}/InventoryShare-dev").eachDir { dir ->
        if (file("${dir}/build.gradle").exists()) {
            include "InventoryShare-dev:${dir.name}"
        }
    }
}

