name: 기능 제안 (Feature Request)
description: 새로운 기능이나 개선 아이디어 / Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 제안 배경 (Motivation)
      description: |
        어떤 불편함이나 필요가 있나요?
        What problem or need does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 원하는 기능 (Proposed feature)
      description: |
        어떻게 동작하면 좋을지 구체적으로 적어주세요.
        Describe how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안 (Alternatives)
      description: |
        고려해 본 다른 방법이 있다면 적어주세요.
        Any alternatives you've considered?
